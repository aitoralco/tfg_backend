[project]
name = "tfg-backend"
version = "0.1.0"
description = "REST API of Whaler: users, video upload and streaming, and access to the AI processing results"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "boto3>=1.42.6",
    "fastapi>=0.118.0",
    "passlib>=1.7.4",
    "psycopg2-binary>=2.9.10",
    "pydantic[email]>=2.11.9",
    "python-multipart>=0.0.20",
    "redis>=7.1.0",
    "rq>=2.6.1",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.37.0",
    "python-jose[cryptography]>=3.3.0",
    "pydantic-settings>=2.0.0",
]
